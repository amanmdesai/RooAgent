[pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore matplotlib/pyparsing deprecation noise originating from their internals
    ignore:.*matplotlib.*:DeprecationWarning
    ignore:.*pyparsing.*:DeprecationWarning
    # Ignore fontconfig/style related deprecation warnings from matplotlib internals
    ignore:.*fontconfig.*:DeprecationWarning
    # Ignore the ChatOpenAI model_kwargs warning when present in test environments
    ignore:Parameters .* should be specified explicitly:UserWarning

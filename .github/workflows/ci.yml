name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rootproject/root:6.34.00-ubuntu24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y python3-pip python3-venv git
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Verify ROOT runtime
        run: |
          root-config --version
          python3 -c "import ROOT; print(ROOT.gROOT.GetVersion())"

      - name: Install package and test dependencies
        run: |
          python3 -m pip install -e .
          python3 -m pip install pytest matplotlib

      - name: Generate ROOT test files
        run: |
          python3 tests/gen_test_root_files.py

      - name: Run tests
        shell: bash -l {0}
        run: |
          python3 -m pytest -q tests/

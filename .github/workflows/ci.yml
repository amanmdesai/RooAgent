name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.10

      - name: Create conda env and install dependencies
        shell: bash -l {0}
        run: |
          conda create -n rooenv -y -c conda-forge python=3.10 root numpy pandas pip
          source $(conda info --base)/etc/profile.d/conda.sh
          conda activate rooenv
          pip install --upgrade pip
          pip install -e .

      - name: Generate ROOT test files
        shell: bash -l {0}
        run: |
          source $(conda info --base)/etc/profile.d/conda.sh
          conda activate rooenv
          python tests/gen_test_root_files.py

      - name: Run tests
        shell: bash -l {0}
        run: |
          source $(conda info --base)/etc/profile.d/conda.sh
          conda activate rooenv
          pytest -q tests/
